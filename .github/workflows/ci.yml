name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Full Chromium (not only the headless shell): the Chrome extension end-to-end test loads an unpacked
      # extension, which needs it. Same Playwright version as the Java dependency, so the same browser revision.
      - name: Install Playwright Chromium (Linux, with system dependencies)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.65.1 install --with-deps chromium
      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx -y playwright@1.65.1 install chromium
      - name: Build and test
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: '**/target/surefire-reports/'

  plugin:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - name: Install backend artifacts
        run: mvn -B -q install -DskipTests
      - name: Build, test and verify plugin
        working-directory: intellij-plugin
        run: ./gradlew buildPlugin test verifyPlugin --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
