<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
  <strong>Demo App</strong>
  <button id="menu-toggle" aria-label="Open menu">☰</button>
  <nav aria-label="Main"><a href="/login">Login</a><a href="/register">Register</a><a href="/a11y">Accessibility</a></nav>
</header>
<main>
  <section class="card" aria-labelledby="login-title">
    <h1 id="login-title">Sign in</h1>
    <div id="login-error" class="banner error" role="alert" hidden></div>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <div class="error" id="email-error"></div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" data-testid="password" autocomplete="current-password" required>
      <div class="error" id="password-error"></div>
      <button type="submit">Sign In</button>
    </form>
  </section>
</main>
<script src="/js/nav.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
