<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
  <strong>Demo App</strong>
  <button id="menu-toggle" aria-label="Open menu">☰</button>
  <nav aria-label="Main"><a href="/login">Login</a><a href="/register">Register</a></nav>
</header>
<main>
  <section class="card">
    <h1>Create account</h1>
    <form id="register-form" novalidate>
      <label for="r-name">Full name</label>
      <input id="r-name" name="name" required>
      <div class="error" id="name-error"></div>
      <label for="r-email">Email</label>
      <input id="r-email" name="email" type="email" required>
      <div class="error" id="r-email-error"></div>
      <label for="r-password">Password</label>
      <input id="r-password" name="password" type="password" minlength="8" required>
      <div class="error" id="r-password-error"></div>
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Choose…</option>
        <option value="nl">Netherlands</option>
        <option value="de">Germany</option>
        <option value="us">United States</option>
      </select>
      <label><input type="checkbox" id="terms" name="terms"> I accept the terms</label>
      <div class="error" id="terms-error"></div>
      <button type="submit">Create account</button>
    </form>
    <p id="register-result" role="status"></p>
  </section>
</main>
<script src="/js/nav.js"></script>
<script>
  const f = document.getElementById('register-form');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const set = (id, msg) => { document.getElementById(id).textContent = msg; return !msg; };
    let ok = set('name-error', f.name.value.trim() ? '' : 'Name is required');
    ok = set('r-email-error', /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value) ? '' : 'Enter a valid email address') && ok;
    ok = set('r-password-error', f.password.value.length >= 8 ? '' : 'Password must be at least 8 characters') && ok;
    ok = set('terms-error', f.terms.checked ? '' : 'You must accept the terms') && ok;
    if (!ok) return;
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name.value, email: f.email.value, country: f.country.value }) });
    document.getElementById('register-result').textContent = r.ok ? 'Account created' : 'Registration failed';
  });
</script>
</body>
</html>
